<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photo Compressor</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --muted:#6b7280; --accent:#2563eb; --border:#e5e7eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111317; --card:#1b1e24; --text:#f1f3f5; --muted:#9aa3af; --accent:#60a5fa; --border:#2b3038; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:20px; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  .wrap { max-width:560px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px; }
  h1 { font-size:1.3rem; margin:0 0 14px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:12px 0 4px; }
  input[type=text], select { width:100%; padding:10px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:1rem; }
  input[type=range] { width:100%; }
  button { width:100%; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; margin-top:14px; }
  button:disabled { opacity:.5; }
  img { max-width:100%; border-radius:8px; margin-top:8px; }
  .stats, #status { font-size:.9rem; color:var(--muted); margin-top:10px; }
  a.dl { display:block; text-align:center; margin-top:10px; color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>📷 Photo Compressor</h1>

  <div class="card">
    <label>Upload-URL Lambda Function URL</label>
    <input type="text" id="url" placeholder="https://xxxx.lambda-url.ap-southeast-2.on.aws/">

    <label>Photo</label>
    <input type="file" id="file" accept="image/*">

    <label>Max width: <span id="wv">1280</span> px</label>
    <input type="range" id="width" min="320" max="4000" step="80" value="1280">

    <label>Quality: <span id="qv">75</span></label>
    <input type="range" id="quality" min="10" max="100" step="5" value="75">

    <label>Format</label>
    <select id="format"><option>JPEG</option><option>WEBP</option><option>PNG</option></select>

    <button id="go">Compress</button>
    <div id="status"></div>
  </div>

  <div class="card" id="result" hidden>
    <div class="stats" id="stats"></div>
    <img id="preview" alt="Compressed preview">
    <a class="dl" id="download">Download compressed image</a>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
try { $("url").value = localStorage.getItem("uploadUrlLambda") || ""; } catch (e) {}
$("width").oninput = e => $("wv").textContent = e.target.value;
$("quality").oninput = e => $("qv").textContent = e.target.value;
const kb = n => (n / 1024).toFixed(1) + " KB";
const sleep = ms => new Promise(r => setTimeout(r, ms));

$("go").onclick = async () => {
  const file = $("file").files[0];
  const url = $("url").value.trim();
  if (!url || !file) return alert("Add your Lambda URL and pick a photo.");
  try { localStorage.setItem("uploadUrlLambda", url); } catch (e) {}

  $("go").disabled = true;
  $("result").hidden = true;
  try {
    $("status").textContent = "1/3 Getting upload link...";
    const r1 = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        max_width: +$("width").value,
        quality: +$("quality").value,
        format: $("format").value
      })
    });
    const info = await r1.json();
    if (!r1.ok) throw new Error(info.error || "Could not get upload link");

    $("status").textContent = "2/3 Uploading to S3...";
    const r2 = await fetch(info.upload_url, { method: "PUT", body: file });
    if (!r2.ok) throw new Error("Upload failed (" + r2.status + "). Check the input bucket CORS.");

    $("status").textContent = "3/3 Compressing...";
    let blob = null;
    for (let i = 0; i < 40 && !blob; i++) {
      await sleep(1500);
      try {
        const r3 = await fetch(info.download_url);
        if (r3.ok) blob = await r3.blob();
      } catch (e) { /* not ready yet */ }
    }
    if (!blob) throw new Error("Timed out waiting for the compressed image. Check the resizer Lambda logs.");

    const src = URL.createObjectURL(blob);
    $("preview").src = src;
    $("download").href = src;
    $("download").download = "compressed." + (info.format === "jpeg" ? "jpg" : info.format);
    const saved = Math.round((1 - blob.size / file.size) * 100);
    $("stats").textContent = kb(file.size) + " → " + kb(blob.size) + " (" + saved + "% smaller)";
    $("result").hidden = false;
    $("status").textContent = "Done ✓";
  } catch (e) {
    $("status").textContent = "";
    alert("Error: " + e.message);
  } finally {
    $("go").disabled = false;
  }
};
</script>
</body>
</html>
